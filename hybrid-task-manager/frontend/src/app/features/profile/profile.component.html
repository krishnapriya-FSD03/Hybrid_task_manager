<h1>My Profile</h1>

<mat-card class="profile-card">
  <div class="readonly-row">
    <div>
      <span class="label">Username</span>
      <span class="value">&#64;{{ auth.currentUser()?.username }}</span>
    </div>
    <div>
      <span class="label">Account type</span>
      <span class="value account-type">{{ auth.currentUser()?.account_type }}</span>
    </div>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>First name</mat-label>
        <input matInput formControlName="first_name" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Last name</mat-label>
        <input matInput formControlName="last_name" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Avatar URL</mat-label>
      <input matInput formControlName="avatar_url" placeholder="https://..." />
    </mat-form-field>

    <div class="toggle-row">
      <mat-slide-toggle formControlName="email_notifications_enabled">
        Email me about task assignments, comments, and reminders
      </mat-slide-toggle>
    </div>

    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving">
      {{ saving ? 'Saving...' : 'Save changes' }}
    </button>
  </form>
</mat-card>

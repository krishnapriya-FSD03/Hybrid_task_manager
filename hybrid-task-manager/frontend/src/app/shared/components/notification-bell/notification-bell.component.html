<button mat-icon-button [matMenuTriggerFor]="menu" (menuOpened)="loadList()" aria-label="Notifications">
  <mat-icon [matBadge]="notifications.unreadCount() || null" matBadgeColor="warn" matBadgeSize="small">
    notifications
  </mat-icon>
</button>
<mat-menu #menu="matMenu" class="notification-menu">
  <div class="notification-header" (click)="$event.stopPropagation()">
    <span>Notifications</span>
    <button mat-button (click)="markAllRead()" [disabled]="!notifications.unreadCount()">Mark all read</button>
  </div>
  @if (items.length === 0) {
    <div class="notification-empty">You're all caught up.</div>
  }
  @for (n of items; track n.id) {
    <button mat-menu-item [class.unread]="!n.is_read" (click)="onSelect(n)">
      <div class="notification-item">
        <span class="notification-message">{{ n.message }}</span>
        <span class="notification-time">{{ n.created_at | date: 'short' }}</span>
      </div>
    </button>
  }
</mat-menu>
